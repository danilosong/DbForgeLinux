name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  quality:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install 7-Zip for ZIP AES interoperability tests
        run: sudo apt-get update && sudo apt-get install -y 7zip
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.4
            image: mysql:8.4
          - name: MariaDB 11
            image: mariadb:11
    services:
      database:
        # TCP probe instead of mysqladmin: mariadb:11 images no longer ship the mysqladmin binary.
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: integration-only
          MYSQL_DATABASE: sample
        ports:
          - 33067:3306
        options: >-
          --health-cmd="bash -c 'exec 3<>/dev/tcp/127.0.0.1/3306'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install a local mysqldump client for integration tests
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - run: pnpm mysql:clean-test
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '33067'
          MYSQL_USER: root
          MYSQL_PASSWORD: integration-only
      - run: pnpm typecheck
      - run: pnpm test
        env:
          MYSQL_INTEGRATION: '1'
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '33067'
          MYSQL_USER: root
          MYSQL_PASSWORD: integration-only

  smoke-and-package:
    name: Desktop smoke and Debian package
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-only
          MYSQL_DATABASE: sample
        ports:
          - 33067:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pintegration-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install Linux desktop runtime
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-0 libasound2t64 libgbm1 xvfb
        working-directory: .
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:deb
      - name: Smoke test under Xvfb
        run: pnpm smoke:e2e
        env:
          MYSQL_ROOT_PASSWORD: integration-only
      - name: Verify Debian package in clean Ubuntu 24.04 container
        working-directory: .
        run: |
          package_path="$(realpath app/dist/*.deb)"
          export package_path
          env -u DISPLAY -u WAYLAND_DISPLAY -u XDG_SESSION_TYPE xvfb-run -a bash -euc '
            container_auth="$(mktemp)"
            trap '\''rm -f "$container_auth"'\'' EXIT
            xauth -f "$XAUTHORITY" nlist "$DISPLAY" | sed "s/^..../ffff/" | xauth -f "$container_auth" nmerge -
            docker run --rm --network host \
              -e DISPLAY="$DISPLAY" \
              -e XAUTHORITY="$container_auth" \
              -v /tmp/.X11-unix:/tmp/.X11-unix:ro \
              -v "$container_auth:$container_auth:ro" \
              -v "$package_path:/tmp/tuxsql.deb:ro" \
              ubuntu:24.04 bash -euc "
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends /tmp/tuxsql.deb
                dpkg -c /tmp/tuxsql.deb >/tmp/package-files.txt
                executable=/opt/TuxSQL/tuxsql
                test -x \"\$executable\"
                ldd \"\$executable\" | tee /tmp/ldd.txt
                if grep -q \"not found\" /tmp/ldd.txt; then
                  echo \"Unresolved shared library in packaged Electron executable\" >&2
                  exit 1
                fi
                \"\$executable\" --no-sandbox &
                electron_pid=\$!
                sleep 5
                kill -0 \$electron_pid
                kill -TERM \$electron_pid
                wait \$electron_pid || test \$? -eq 143
              "
          '
      - uses: actions/upload-artifact@v4
        with:
          name: tuxsql-deb
          path: app/dist/*.deb
          if-no-files-found: error
          retention-days: 14
