appId: com.tuxsql.app
productName: TuxSQLSong
directories:
  output: dist
  buildResources: packaging
files:
  - out/**/*
  - bootstrap/**/*
  - package.json
extraMetadata:
  main: bootstrap/dev-link.cjs
fileAssociations:
  - ext: sql
    name: SQL script
    mimeType: text/x-sql
    role: Editor
linux:
  icon: packaging/icon.png
  executableName: tuxsql
  syncDesktopName: true
  mimeTypes:
    - application/sql
  target:
    - AppImage
    - deb
  category: Development;Database;
  maintainer: TuxSQL Song contributors <noreply@github.com>
  desktop:
    entry:
      Name: TuxSQL Song
      Icon: tuxsql
      StartupWMClass: tuxsql
      StartupNotify: 'true'
  synopsis: MySQL and MariaDB database client
  description: Desktop database client for MySQL and MariaDB.
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - libgbm1
artifactName: tuxsql_${version}_${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: danilosong
  repo: TuxSQL
  releaseType: release
