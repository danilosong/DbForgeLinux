services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: integration-only
      MYSQL_DATABASE: sample
    ports:
      - "127.0.0.1:33067:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h127.0.0.1", "-uroot", "-pintegration-only"]
      interval: 2s
      timeout: 2s
      retries: 30
