<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
    <title>TuxSQL startup</title>
    <link rel="stylesheet" href="/splash/splash.css" />
  </head>
  <body>
    <main class="splash" aria-label="TuxSQL startup screen">
      <svg class="filter-defs" aria-hidden="true" focusable="false">
        <filter id="spray-warp" x="-8%" y="-18%" width="116%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.05 0.1" numOctaves="2" seed="8" result="spray" />
          <feDisplacementMap in="SourceGraphic" in2="spray" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </svg>
      <div class="wall-grain" aria-hidden="true"></div>
      <div class="top-row"><span class="brand-kicker" id="brand-kicker">DATABASE CLIENT · LINUX</span><span class="version" id="version">TuxSQL</span></div>
      <section class="brand-lockup" aria-label="TuxSQL by Song">
        <div class="wordmark-wrap">
          <h1 class="wordmark" id="wordmark">TuxSQL</h1>
          <span class="paint-drip drip-one" aria-hidden="true"></span>
          <span class="paint-drip drip-two" aria-hidden="true"></span>
          <span class="paint-drip drip-three" aria-hidden="true"></span>
          <span class="paint-drip drip-four" aria-hidden="true"></span>
          <span class="paint-drip drip-five" aria-hidden="true"></span>
        </div>
        <div class="signature-row">
          <svg class="signature-swoosh" viewBox="0 0 116 20" aria-hidden="true"><path d="M3 13C28 6 59 5 102 11c5 1 8 2 11 4"/><path d="M88 6c8 1 14 4 22 9"/></svg>
          <span class="signature">Song</span>
          <span class="spark spark-one" aria-hidden="true">✦</span>
          <span class="spark spark-two" aria-hidden="true">✧</span>
        </div>
      </section>
      <footer class="startup-status">
        <div class="stage-row"><span class="stage-label" id="stage" aria-live="polite">Starting TuxSQL</span><span class="percentage" id="percentage">0%</span></div>
        <div class="progress-track" id="progress" role="progressbar" aria-label="Startup progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Starting TuxSQL">
          <div class="progress-spray"><span class="progress-fill" id="progress-fill"></span><span class="spray-speck speck-a" aria-hidden="true"></span><span class="spray-speck speck-b" aria-hidden="true"></span><span class="spray-speck speck-c" aria-hidden="true"></span></div>
        </div>
        <div class="status-caption"><span class="status-dot" aria-hidden="true"></span><span>MySQL · MariaDB</span><span class="copyright">© Song</span></div>
      </footer>
    </main>
    <script type="module" src="/splash/main.ts"></script>
  </body>
</html>
